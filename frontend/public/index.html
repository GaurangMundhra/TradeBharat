<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="TradeBharat - Real-time Trading Platform with Live Candlestick Charts"
    />
    <meta
      property="og:title"
      content="TradeBharat - Real-time Trading Platform"
    />
    <meta
      property="og:description"
      content="Professional trading charts with real-time data streaming"
    />
    <meta property="og:type" content="website" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:title"
      content="TradeBharat - Real-time Trading Platform"
    />
    <meta
      property="twitter:description"
      content="Professional trading charts with real-time data streaming"
    />

    <title>TradeBharat - Real-time Trading Platform</title>

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- No-op stylesheet for CSP compliance -->
    <style>
      /* Prevent FOUC (Flash of Unstyled Content) */
      html {
        background-color: #0f172a;
      }

      body {
        background-color: #0f172a;
        color: #f3f4f6;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        margin: 0;
        padding: 0;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading state */
      .loading-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-size: 18px;
        color: #3b82f6;
      }
    </style>
  </head>
  <body>
    <!-- No-JS fallback -->
    <noscript>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: #0f172a;
          color: #f3f4f6;
          text-align: center;
          padding: 20px;
          font-family: system-ui;
        "
      >
        <div>
          <h1 style="margin: 0 0 20px 0">⚠️ JavaScript Required</h1>
          <p style="margin: 0">
            TradeBharat requires JavaScript to run. Please enable JavaScript in
            your browser settings.
          </p>
        </div>
      </div>
    </noscript>

    <!-- React Root Element -->
    <div id="root">
      <div class="loading-spinner">
        <div>
          <span
            style="
              display: inline-block;
              animation: spin 1s linear infinite;
              font-size: 32px;
            "
            >⚙️</span
          >
          <p style="margin-top: 16px; font-size: 16px">
            Loading TradeBharat...
          </p>
        </div>
      </div>
    </div>

    <!-- Inline loading animation -->
    <style>
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- React and ReactDOM will be injected by create-react-app -->
    <!-- The main React app entry point will be rendered in #root above -->
  </body>
</html>
